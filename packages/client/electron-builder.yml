appId: com.pyrobotics.solidsync
productName: SolidSync
copyright: Copyright © 2026 Pyrobotics
electronVersion: 43.3.0

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - '!out/**/*.map'
  - package.json

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: SolidSync
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.png
  category: Utility
  maintainer: Pyrobotics
  vendor: Pyrobotics
  executableName: solidsync
  syncDesktopName: true
  synopsis: Shop-floor part filer
  description: SolidSync syncs your files across the shop floor.

publish:
  - provider: github
    owner: baggiest
    repo: solidsync
