appId: com.pyrobotics.solidsync
productName: SolidSync
copyright: Copyright © 2026 Pyrobotics
electronVersion: 43.3.0

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - '!out/**/*.map'
  - package.json

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: SolidSync
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

publish:
  - provider: generic
    url: https://example.com/solidsync/ # placeholder, replace when you have a host