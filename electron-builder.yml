appId: com.pyrobotics.solidgit
productName: SolidGit
copyright: Copyright © 2026 Pyrobotics

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - '!out/**/*.map'
  - package.json

asarUnpack:
  - '**/node_modules/sql.js/dist/**'

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: SolidGit
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

publish:
  - provider: generic
    url: https://example.com/solidgit/ # placeholder, replace when you have a host